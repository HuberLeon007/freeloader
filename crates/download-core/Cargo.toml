[package]
name = "freeloader-download-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = "=0.3.31"
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.210", features = ["derive"] }
sqlx = { version = "=0.8.2", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "=2.0.11"
tokio = { version = "=1.40.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "=1.10.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.13.0"
