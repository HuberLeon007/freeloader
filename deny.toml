[advisories]
version = 2
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "LGPL-2.1-only", "LGPL-3.0-only"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
workspace-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
